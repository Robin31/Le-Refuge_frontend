name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
      - developement
      - staging
      - production

  pull_request:
    branches:
      - developement
      - staging
      - production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
      
      - name: Run tests with increased memory
        run: node --max-old-space-size=4096 ./node_modules/.bin/jest --verbose

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'production')
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build app for ${{ github.base_ref }}
        run: |
          if [ "${{ github.base_ref }}" = "staging" ]; then
            npm run build:staging
          elif [ "${{ github.base_ref }}" = "production" ]; then
            npm run build:production
          else
            echo "Unknown base branch"
            exit 1
          fi

      - name: Start server in background
        run: npx http-server dist/frontend/browser -p 4200 --spa &

      - name: Wait for http://localhost:4200
        run: npx wait-on http://localhost:4200

      - name: Run e2e tests for ${{ github.base_ref }}
        run: |
          if [ "${{ github.base_ref }}" = "staging" ]; then
            npm run e2e:ci:staging
          elif [ "${{ github.base_ref }}" = "production" ]; then
            npm run e2e:ci:production
          else
            echo "Unknown base branch for e2e"
            exit 1
          fi

